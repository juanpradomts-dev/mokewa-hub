# Actualiza los datos de Lichess cada hora, corre las pruebas y publica el sitio.
# Hosting gratuito: GitHub Pages (o Cloudflare Pages conectando este mismo repositorio).
name: Actualizar y publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *" # cada hora (minuto 17 para no coincidir con la hora en punto)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Datos de Lichess (incremental; si Lichess falla se usa la caché)
        run: node scripts/lichess.mjs
      - run: npm test
      - name: Guardar la caché actualizada en el repositorio
        run: |
          git config user.name "mokewa-bot"
          git config user.email "mokewa-bot@users.noreply.github.com"
          git add data/lichess
          git diff --cached --quiet || git commit -m "datos: actualización de Lichess" && git push
      - name: Construir la web oficial
        run: npm run build
        env:
          SITE: https://${{ github.repository_owner }}.github.io
          BASE: /${{ github.event.repository.name }}
          PUBLIC_MODO: produccion
          # Variables del repositorio (Settings → Secrets and variables → Actions → Variables):
          # PUBLIC_INDEXAR=si la muestra en Google; PUBLIC_SUPABASE_* activan inscripción en línea y panel.
          PUBLIC_INDEXAR: ${{ vars.PUBLIC_INDEXAR || 'no' }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
      - name: Construir la copia de demostración en /demo/ (panel de prueba para presentar; no se indexa)
        run: npm run build
        env:
          SITE: https://${{ github.repository_owner }}.github.io
          BASE: /${{ github.event.repository.name }}/demo
          OUT_DIR: dist/demo
          PUBLIC_MODO: demo
      - name: Mantener activa la base de datos (el plan gratuito de Supabase se pausa tras una semana sin uso)
        if: ${{ vars.PUBLIC_SUPABASE_URL != '' }}
        run: |
          curl -fsS "${{ vars.PUBLIC_SUPABASE_URL }}/rest/v1/contenido?select=campo&limit=1"             -H "apikey: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}" > /dev/null
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
